# Stable options only. `group_imports`, `imports_granularity`, `wrap_comments`,
# `comment_width` and `format_code_in_doc_comments` are nightly-only: on stable
# rustfmt warns and ignores them, so a file listing them would document a policy
# the formatter is not applying. Adopting them means a pinned nightly rustfmt in
# the flake and `cargo +nightly fmt` everywhere.
max_width                = 100
newline_style            = "Unix"   # the default, "Auto", is platform-dependent
use_field_init_shorthand = true
